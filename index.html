<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>arc.app.hub</title>
<meta name="description" content="アプリの入口をひとまとめにしたページです。">
<style>
  :root {
    --bg: #0b1020;
    --bg2: #1b2a55;
    --surface: #151d38;
    --ink: #f2f5ff;
    --muted: #9aa6c8;
    --line: #2b3760;
    --accent: #7aa8ff;
    --hot: #ff6b8b;
    /* ポップな差し色(カテゴリごとに自動で割り当て) */
    --c0: #7aa8ff; --c1: #4fd6c4; --c2: #ffc857; --c3: #ff7e8b; --c4: #b992ff; --c5: #9be564;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background: radial-gradient(900px 420px at 80% -8%, var(--bg2) 0%, var(--bg) 62%) fixed, var(--bg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.6;
    padding-bottom: env(safe-area-inset-bottom);
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right)); }

  header { padding: calc(28px + env(safe-area-inset-top)) 0 6px; }
  h1 { margin: 0; font-size: 1.7rem; font-weight: 900; letter-spacing: .02em; line-height: 1.2; }
  h1 span { background: linear-gradient(90deg, var(--c0), var(--c4), var(--c3)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .lead { margin: 6px 0 0; color: var(--muted); font-size: .92rem; }

  /* 検索と絞り込みは、スクロールしても上に残す */
  .tools {
    position: sticky; top: 0; z-index: 5;
    margin: 14px -16px 0;
    padding: 10px 16px 12px;
    background: linear-gradient(var(--bg) 70%, rgba(11,16,32,0));
  }
  .search {
    width: 100%;
    padding: 13px 18px;
    font: inherit; font-size: 16px; /* 16px未満だとiPhoneで拡大されてしまう */
    color: var(--ink);
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 999px;
    appearance: none; -webkit-appearance: none;
  }
  .search::placeholder { color: var(--muted); }
  .search:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(122,168,255,.22); }
  .chips {
    display: flex; gap: 8px; margin-top: 10px;
    overflow-x: auto; scrollbar-width: none;
    padding: 2px 16px 4px; margin-left: -16px; margin-right: -16px;
    scroll-snap-type: x proximity;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; scroll-snap-align: start;
    min-height: 40px;
    font: inherit; font-size: .92rem; font-weight: 700; color: var(--ink);
    padding: 6px 16px;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: #0b1020; border-color: var(--accent); }

  /* アプリのタイル: スマホは2列、広い画面では自動で増える */
  .grid {
    list-style: none; margin: 0; padding: 8px 0 56px;
    display: grid; gap: 14px;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .card {
    position: relative;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px;
    height: 100%;
    padding: 20px 12px 16px;
    text-decoration: none;
    background: linear-gradient(165deg, var(--surface), #0f162d);
    border: 2px solid var(--tone);
    border-radius: 24px;
    box-shadow: 0 5px 0 var(--tone);       /* 立体的なポップ感 */
    transition: transform .08s, box-shadow .08s;
  }
  .card:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tone); }
  .arch {
    width: 68px; height: 68px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--tone);
    color: #0b1020;
    font-size: 2rem; font-weight: 900;
    overflow: hidden;
    box-shadow: 0 0 22px color-mix(in srgb, var(--tone) 45%, transparent);
  }
  .arch img { width: 100%; height: 100%; object-fit: cover; }
  .body { min-width: 0; width: 100%; }
  .name { margin: 0; font-size: 1.02rem; font-weight: 900; line-height: 1.35; overflow-wrap: anywhere; }
  .new {
    display: inline-block; vertical-align: middle; margin-left: 6px;
    font-size: .68rem; font-weight: 900; line-height: 1.7;
    color: #fff; background: var(--hot);
    padding: 0 8px; border-radius: 999px;
  }
  .desc {
    margin: 4px 0 0; font-size: .82rem; color: var(--muted); line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .cat {
    display: inline-block; margin: 8px 0 0;
    font-size: .72rem; font-weight: 800; color: var(--tone);
    border: 1.5px solid var(--tone); border-radius: 999px; padding: 0 10px;
  }

  .status { padding: 48px 0 80px; color: var(--muted); text-align: center; }
  .status strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }

  footer { border-top: 1px solid var(--line); padding: 16px 0 28px; color: var(--muted); font-size: .8rem; text-align: center; }

  @media (min-width: 600px) {
    h1 { font-size: 2.1rem; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
    .tools { margin: 14px 0 0; padding-left: 0; padding-right: 0; }
    .chips { margin-left: 0; margin-right: 0; padding-left: 0; padding-right: 0; flex-wrap: wrap; overflow: visible; }
    .card:hover { transform: translateY(-3px); }
  }
  @media (max-width: 340px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>arc<span>.app.hub</span></h1>
    <p class="lead">使うアプリをここから開きます。</p>
  </div>
</header>

<div class="wrap">
  <div class="tools">
    <input id="q" class="search" type="search" placeholder="アプリ名・説明・タグで探す" aria-label="アプリを検索" enterkeyhint="search">
    <div id="chips" class="chips" role="group" aria-label="カテゴリで絞り込み"></div>
  </div>
</div>

<main class="wrap">
  <div id="status" class="status" role="status">読み込み中です…</div>
  <ul id="grid" class="grid" hidden></ul>
</main>

<footer>
  <div class="wrap">アプリはタップすると新しいタブで開きます。</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  const NEW_DAYS = 14;
  const ALL = "すべて";
  const TONES = ["--c0", "--c1", "--c2", "--c3", "--c4", "--c5"];

  const $q = document.getElementById("q");
  const $chips = document.getElementById("chips");
  const $grid = document.getElementById("grid");
  const $status = document.getElementById("status");

  let apps = [];
  let category = ALL;
  let query = "";

  function toneOf(text) {
    let h = 0;
    for (const ch of text || "") h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return "var(" + TONES[h % TONES.length] + ")";
  }

  function isNew(app) {
    return Date.now() - new Date(app.created_at).getTime() < NEW_DAYS * 86400000;
  }

  function showStatus(title, detail) {
    $grid.hidden = true;
    $status.hidden = false;
    $status.replaceChildren();
    const s = document.createElement("strong");
    s.textContent = title;
    $status.append(s);
    if (detail) $status.append(detail);
  }

  function renderChips() {
    const cats = [ALL, ...new Set(apps.map(a => a.category).filter(Boolean))];
    $chips.replaceChildren();
    $chips.hidden = cats.length <= 2;
    for (const c of cats) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = c;
      b.setAttribute("aria-pressed", String(c === category));
      b.addEventListener("click", () => { category = c; renderChips(); renderGrid(); });
      $chips.append(b);
    }
  }

  function iconNode(app) {
    const box = document.createElement("div");
    box.className = "arch";
    box.setAttribute("aria-hidden", "true");
    if (/^https?:\/\//i.test(app.icon)) {
      const img = document.createElement("img");
      img.src = app.icon;
      img.alt = "";
      img.loading = "lazy";
      img.addEventListener("error", () => { img.remove(); box.textContent = app.name.slice(0, 1); });
      box.append(img);
    } else {
      box.textContent = app.icon || app.name.slice(0, 1);
    }
    return box;
  }

  function cardNode(app) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "card";
    a.href = app.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.setProperty("--tone", toneOf(app.category || app.name));

    const body = document.createElement("div");
    body.className = "body";

    const name = document.createElement("p");
    name.className = "name";
    name.append(document.createTextNode(app.name));
    if (isNew(app)) {
      const n = document.createElement("span");
      n.className = "new";
      n.textContent = "新着";
      name.append(n);
    }
    body.append(name);

    if (app.description) {
      const d = document.createElement("p");
      d.className = "desc";
      d.textContent = app.description;
      body.append(d);
    }
    if (app.category) {
      const c = document.createElement("span");
      c.className = "cat";
      c.textContent = app.category;
      body.append(c);
    }

    a.append(iconNode(app), body);
    li.append(a);
    return li;
  }

  function renderGrid() {
    const words = query.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const list = apps.filter(a => {
      if (category !== ALL && a.category !== category) return false;
      const hay = [a.name, a.description, a.category, ...(a.tags || [])].join(" ").toLowerCase();
      return words.every(w => hay.includes(w));
    });

    if (list.length === 0) {
      if (apps.length === 0) showStatus("まだアプリが登録されていません。", document.createTextNode("講師が追加するとここに表示されます。"));
      else showStatus("見つかりませんでした。", document.createTextNode("検索語やカテゴリを変えてみてください。"));
      return;
    }
    $status.hidden = true;
    $grid.hidden = false;
    $grid.replaceChildren(...list.map(cardNode));
  }

  async function init() {
    const cfg = window.ARC_CONFIG;
    if (!cfg || !cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes("xxxx")) {
      showStatus("設定がまだ完了していません。", document.createTextNode("config.js に Supabase の URL と anon キーを入力してください。"));
      return;
    }
    const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
    const { data, error } = await sb
      .from("apps")
      .select("*")
      .eq("visible", true)
      .order("sort_order", { ascending: true })
      .order("created_at", { ascending: true });

    if (error) {
      console.error(error);
      showStatus("読み込めませんでした。", document.createTextNode("時間をおいて、ページを再読み込みしてください。"));
      return;
    }
    apps = data || [];
    renderChips();
    renderGrid();
  }

  $q.addEventListener("input", () => { query = $q.value; renderGrid(); });
  init();
})();
</script>
</body>
</html>
