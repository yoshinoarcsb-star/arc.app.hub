<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="robots" content="noindex, nofollow">
<title>講師用 | arc.app.hub</title>
<style>
  :root {
    --bg: #0b1020;
    --bg2: #1b2a55;
    --surface: #151d38;
    --surface2: #0f162d;
    --ink: #f2f5ff;
    --muted: #9aa6c8;
    --line: #2b3760;
    --focus: #7aa8ff;
    --primary: #7aa8ff;
    --primary-ink: #0b1020;
    --danger: #ff7e8b;
    --ok: #6fd1a0;
    --c0: #7aa8ff; --c1: #4fd6c4; --c2: #ffc857; --c3: #ff7e8b; --c4: #b992ff; --c5: #9be564;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background: radial-gradient(900px 420px at 80% -8%, var(--bg2) 0%, var(--bg) 62%) fixed, var(--bg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
    line-height: 1.6;
    padding-bottom: env(safe-area-inset-bottom);
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-left)) 0 max(16px, env(safe-area-inset-right)); }

  .topbar { background: rgba(21,29,56,.92); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top); position: sticky; top: 0; z-index: 6; backdrop-filter: blur(8px); }
  .topbar .wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
  .brand-mark { width: 22px; height: 26px; border-radius: 11px 11px 3px 3px; background: linear-gradient(160deg, var(--c0), var(--c4)); }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 900; }
  .who { color: var(--muted); font-size: .78rem; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; order: 5; }

  .btn {
    font: inherit; font-size: .92rem; font-weight: 700; color: var(--ink);
    min-height: 44px; padding: 8px 16px;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); font-weight: 900; }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 55%, var(--line)); }
  .btn.small { min-height: 40px; padding: 4px 14px; font-size: .85rem; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ログイン */
  .login { max-width: 400px; margin: calc(40px + env(safe-area-inset-top)) auto; padding: 24px 20px; background: var(--surface); border: 2px solid var(--line); border-radius: 24px; }
  #loginView { padding: 0 16px; }
  .login h2 { margin: 0 0 4px; font-size: 1.3rem; font-weight: 900; }
  .login p { margin: 0 0 18px; color: var(--muted); font-size: .9rem; }

  label { display: block; font-weight: 800; font-size: .88rem; margin: 14px 0 6px; }
  .hint { font-weight: 400; color: var(--muted); font-size: .78rem; }
  input[type=text], input[type=url], input[type=email], input[type=password] {
    width: 100%; min-height: 46px; padding: 10px 14px;
    font: inherit; font-size: 16px; color: inherit;
    background: var(--surface2);
    border: 2px solid var(--line);
    border-radius: 14px;
    appearance: none; -webkit-appearance: none;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(122,168,255,.2); }
  .err { color: var(--danger); font-size: .88rem; margin: 10px 0 0; min-height: 1.4em; }

  /* ツールバー */
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 18px 0 6px; }
  .bar .spacer { margin-left: auto; }
  .note { color: var(--muted); font-size: .82rem; margin: 0 0 14px; }

  /* 一覧 */
  .list { list-style: none; margin: 0; padding: 0 0 60px; display: grid; gap: 12px; }
  .row {
    display: grid;
    grid-template-columns: auto auto 1fr;
    grid-template-areas: "grip icon info" "acts acts acts";
    gap: 10px 12px; align-items: center;
    padding: 14px;
    background: linear-gradient(165deg, var(--surface), var(--surface2));
    border: 2px solid var(--tone);
    border-radius: 20px;
    box-shadow: 0 4px 0 var(--tone);
  }
  .row > .grip { grid-area: grip; }
  .row > .arch { grid-area: icon; }
  .row > .info { grid-area: info; }
  .row > .acts { grid-area: acts; }
  .row.hidden-app { opacity: .6; border-style: dashed; box-shadow: none; border-color: var(--line); }
  .row.dragging { opacity: .4; }
  .row.over { outline: 3px solid var(--primary); }
  .grip { cursor: grab; color: var(--muted); font-size: 1.2rem; user-select: none; padding: 0 4px; touch-action: none; }
  .arch { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--tone); color: #0b1020; font-weight: 900; font-size: 1.4rem; overflow: hidden; }
  .arch img { width: 100%; height: 100%; object-fit: cover; }
  .info { min-width: 0; }
  .info .n { font-weight: 900; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag-hidden { font-size: .7rem; font-weight: 800; padding: 0 8px; border-radius: 999px; border: 1.5px solid var(--muted); color: var(--muted); }
  .info .u { font-size: .78rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .info .c { font-size: .78rem; font-weight: 800; color: var(--tone); }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-start; }
  .empty { padding: 40px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 2px dashed var(--line); border-radius: 20px; }

  .consoles { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .cbtn { font-size: .8rem; font-weight: 800; padding: 6px 12px; min-height: 34px; display: inline-flex; align-items: center; border-radius: 999px; text-decoration: none; border: 2px solid var(--primary); color: var(--primary); }
  a.cbtn:active { background: var(--primary); color: var(--primary-ink); }
  .cbtn.off { border-style: dashed; border-color: var(--line); color: var(--muted); font-weight: 400; }

  details.memo { margin: 16px 0 4px; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; }
  details.memo > summary { cursor: pointer; padding: 14px 18px; font-weight: 900; min-height: 48px; }
  .memo-body { padding: 0 18px 18px; }
  textarea { width: 100%; min-height: 110px; padding: 10px 14px; font: inherit; font-size: 16px; color: inherit; background: var(--surface2); border: 2px solid var(--line); border-radius: 14px; resize: vertical; }
  .memo-foot { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .memo-foot .note { margin: 0; }

  /* ダイアログ: スマホでは画面下から出るシート */
  dialog {
    width: 100%; max-width: 100%;
    margin: auto 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height: 92vh; overflow-y: auto;
    color: var(--ink); background: var(--surface);
    border: 2px solid var(--line); border-bottom: 0;
    border-radius: 26px 26px 0 0;
  }
  dialog::backdrop { background: rgba(5, 8, 18, .7); }
  dialog h2 { margin: 0 0 4px; font-size: 1.2rem; font-weight: 900; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-weight: 800; min-height: 44px; }
  .check input { width: 22px; height: 22px; accent-color: var(--primary); }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .dlg-actions .btn { flex: 1; }

  /* トースト */
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 12px 20px; background: var(--ink); color: var(--bg); border-radius: 999px; font-size: .9rem; font-weight: 700; z-index: 30; }
  .toast.bad { background: var(--danger); color: #1a0a0c; }

  @media (max-width: 640px) {
    .row { grid-template-columns: auto 1fr; grid-template-areas: "icon info" "acts acts"; }
    .row .grip { display: none; }
    .acts .btn { flex: 1 1 auto; }
    .bar .btn { flex: 1 1 auto; }
    .bar .spacer { margin-left: 0; width: 100%; }
  }
  @media (min-width: 641px) {
    .row { grid-template-columns: auto auto 1fr auto; grid-template-areas: "grip icon info acts"; }
    .acts { justify-content: flex-end; }
    .who { width: auto; order: 0; }
    dialog { width: min(520px, calc(100vw - 32px)); margin: auto; border: 2px solid var(--line); border-radius: 24px; padding: 24px; }
    .dlg-actions .btn { flex: 0 0 auto; }
  }
  @media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>

<!-- ログイン画面 -->
<section id="loginView" hidden>
  <form class="login" id="loginForm">
    <h2>講師ログイン</h2>
    <p>登録済みの講師アカウントでログインします。</p>
    <label for="email">メールアドレス</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">パスワード</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <label class="check" style="margin-top:14px;font-weight:400"><input id="remember" type="checkbox" checked> この端末でログイン状態を保つ</label>
    <p class="hint" style="margin:4px 0 0">共有パソコンでは、チェックを外してください。</p>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn primary" id="loginBtn" type="submit" style="width:100%;margin-top:6px">ログイン</button>
  </form>
</section>

<!-- 管理画面 -->
<section id="adminView" hidden>
  <div class="topbar">
    <div class="wrap">
      <div class="brand"><div class="brand-mark" aria-hidden="true"></div><h1>arc.app.hub 講師用</h1></div>
      <span class="who" id="who"></span>
      <a class="btn small" href="index.html" target="_blank" rel="noopener">生徒画面を開く</a>
      <button class="btn small" id="logoutBtn" type="button">ログアウト</button>
    </div>
  </div>

  <main class="wrap">
    <details class="memo" id="memoBox">
      <summary>自分用メモ(講師だけに表示)</summary>
      <div class="memo-body">
        <label for="mAccount">Supabase管理アカウント名</label>
        <input id="mAccount" type="text" maxlength="200" autocomplete="off">
        <label for="mMemo1">メモ1</label>
        <textarea id="mMemo1" maxlength="5000" autocomplete="off"></textarea>
        <label for="mMemo2">メモ2</label>
        <textarea id="mMemo2" maxlength="5000" autocomplete="off"></textarea>
        <p class="hint">パスワードやAPIキー(特に service_role キー)は書かないでください。</p>
        <div class="memo-foot">
          <button class="btn primary" id="memoSave" type="button">メモを保存</button>
          <span class="note" id="memoStamp" role="status"></span>
        </div>
      </div>
    </details>

    <div class="bar">
      <button class="btn primary" id="addBtn" type="button">アプリを追加</button>
      <button class="btn" id="exportBtn" type="button">JSONを書き出す</button>
      <button class="btn" id="importBtn" type="button">JSONを読み込む</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <span class="spacer note" id="count"></span>
    </div>
    <p class="note">行をドラッグするか「↑」「↓」で並べ替えると、生徒画面の表示順に反映されます。点線の行は生徒には表示されません。コンソールのURLは講師だけに見えます。</p>
    <ul class="list" id="list"></ul>
  </main>
</section>

<!-- 追加・編集ダイアログ -->
<dialog id="dlg">
  <form id="appForm" novalidate>
    <h2 id="dlgTitle">アプリを追加</h2>
    <label for="fName">アプリ名 <span class="hint">(必須・80字まで)</span></label>
    <input id="fName" type="text" maxlength="80" required>
    <label for="fUrl">URL <span class="hint">(https:// から始まるもの)</span></label>
    <input id="fUrl" type="url" placeholder="https://" required>
    <label for="fDesc">説明 <span class="hint">(200字まで)</span></label>
    <input id="fDesc" type="text" maxlength="200">
    <label for="fCat">カテゴリ</label>
    <input id="fCat" type="text" maxlength="40" list="catList">
    <datalist id="catList"></datalist>
    <label for="fIcon">アイコン <span class="hint">(絵文字、または画像のURL。空欄なら頭文字)</span></label>
    <input id="fIcon" type="text" placeholder="📘">
    <label for="fTags">タグ <span class="hint">(カンマ区切り。検索に使われます)</span></label>
    <input id="fTags" type="text" placeholder="算数, 計算">
    <label for="fAdminUrl">管理コンソールのURL <span class="hint">(講師だけに表示・任意)</span></label>
    <input id="fAdminUrl" type="url" placeholder="https://">
    <label for="fLessonUrl">授業コンソールのURL <span class="hint">(講師だけに表示・任意)</span></label>
    <input id="fLessonUrl" type="url" placeholder="https://">
    <label class="check"><input id="fVisible" type="checkbox" checked> 生徒に表示する</label>
    <p class="err" id="formErr" role="alert"></p>
    <div class="dlg-actions">
      <button class="btn" type="button" id="cancelBtn">キャンセル</button>
      <button class="btn primary" type="submit" id="saveBtn">保存</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function () {
  "use strict";

  const TONES = ["--c0", "--c1", "--c2", "--c3", "--c4", "--c5"];
  const $ = id => document.getElementById(id);

  const cfg = window.ARC_CONFIG;
  if (!cfg || !cfg.SUPABASE_URL || cfg.SUPABASE_URL.includes("xxxx")) {
    $("loginView").hidden = false;
    $("loginForm").replaceChildren(Object.assign(document.createElement("p"), {
      textContent: "config.js に Supabase の URL と anon キーを入力してください。"
    }));
    return;
  }
  // ログイン状態の保存先: 「この端末で保つ」ならlocalStorage、外すとタブを閉じるまで(sessionStorage)
  const REMEMBER_KEY = "arc_admin_remember";
  const EMAIL_KEY = "arc_admin_email";
  const remembering = () => { try { return localStorage.getItem(REMEMBER_KEY) !== "0"; } catch (e) { return true; } };
  const pickStore = () => (remembering() ? localStorage : sessionStorage);
  const authStorage = {
    getItem: k => { try { return pickStore().getItem(k); } catch (e) { return null; } },
    setItem: (k, v) => { try { pickStore().setItem(k, v); } catch (e) { /* 保存できない環境 */ } },
    removeItem: k => { try { localStorage.removeItem(k); sessionStorage.removeItem(k); } catch (e) { /* 何もしない */ } }
  };
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { storage: authStorage, persistSession: true, autoRefreshToken: true }
  });

  let apps = [];
  let consoles = {}; // app_id -> { admin_url, lesson_url }
  let userId = null;
  let editingId = null;
  let dragIndex = null;
  let toastTimer = null;

  /* ---------- ユーティリティ ---------- */
  function toast(msg, bad) {
    const t = $("toast");
    t.textContent = msg;
    t.className = "toast" + (bad ? " bad" : "");
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 3500);
  }

  function toneOf(text) {
    let h = 0;
    for (const ch of text || "") h = (h * 31 + ch.codePointAt(0)) >>> 0;
    return "var(" + TONES[h % TONES.length] + ")";
  }

  function normalizeUrl(u) {
    try {
      const x = new URL(u);
      return (x.origin + x.pathname.replace(/\/+$/, "") + x.search + x.hash).toLowerCase();
    } catch (e) { return String(u).toLowerCase(); }
  }

  function validUrl(u) {
    try { const x = new URL(u); return x.protocol === "https:" || x.protocol === "http:"; }
    catch (e) { return false; }
  }

  function parseTags(s) {
    return [...new Set(String(s).split(/[,、]/).map(t => t.trim()).filter(Boolean))].slice(0, 20);
  }

  function slim(a) {
    return {
      id: a.id, name: a.name, url: a.url, description: a.description, category: a.category,
      icon: a.icon, tags: a.tags, visible: a.visible, sort_order: a.sort_order
    };
  }

  /* ---------- 認証 ---------- */
  async function showForSession(session) {
    if (!session) {
      clearMemo();
      $("adminView").hidden = true;
      $("loginView").hidden = false;
      ($("email").value ? $("password") : $("email")).focus();
      return;
    }
    const { data, error } = await sb.from("teachers").select("user_id").eq("user_id", session.user.id).maybeSingle();
    if (error || !data) {
      await sb.auth.signOut();
      $("loginErr").textContent = "このアカウントには講師権限がありません。";
      $("adminView").hidden = true;
      $("loginView").hidden = false;
      return;
    }
    $("who").textContent = session.user.email;
    $("loginView").hidden = true;
    $("adminView").hidden = false;
    userId = session.user.id;
    await Promise.all([loadApps(), loadMemo()]);
  }

  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    $("loginErr").textContent = "";
    $("loginBtn").disabled = true;
    const keep = $("remember").checked;
    try {
      localStorage.setItem(REMEMBER_KEY, keep ? "1" : "0");
      if (keep) localStorage.setItem(EMAIL_KEY, $("email").value.trim());
      else localStorage.removeItem(EMAIL_KEY);
    } catch (x) { /* 保存できない環境 */ }
    const { data, error } = await sb.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });
    $("loginBtn").disabled = false;
    if (error) {
      $("loginErr").textContent = "ログインできませんでした。メールアドレスとパスワードを確認してください。";
      return;
    }
    $("password").value = "";
    await showForSession(data.session);
  });

  $("logoutBtn").addEventListener("click", async () => {
    await sb.auth.signOut();
    apps = [];
    await showForSession(null);
  });

  /* ---------- データ読み込み・保存 ---------- */
  async function loadApps() {
    const [a, c] = await Promise.all([
      sb.from("apps").select("*")
        .order("sort_order", { ascending: true })
        .order("created_at", { ascending: true }),
      sb.from("app_consoles").select("*")
    ]);
    if (a.error) { console.error(a.error); toast("読み込めませんでした。", true); return; }
    apps = a.data || [];
    consoles = {};
    if (c.error) {
      console.error(c.error);
      toast("コンソールURLを読み込めませんでした。add_consoles.sql を実行済みか確認してください。", true);
    } else {
      (c.data || []).forEach(r => { consoles[r.app_id] = r; });
    }
    render();
  }

  async function saveConsoles(appId, adminUrl, lessonUrl) {
    if (!adminUrl && !lessonUrl) {
      const { error } = await sb.from("app_consoles").delete().eq("app_id", appId);
      return error;
    }
    const { error } = await sb.from("app_consoles").upsert({
      app_id: appId, admin_url: adminUrl || null, lesson_url: lessonUrl || null
    });
    return error;
  }

  async function saveOrder() {
    apps.forEach((a, i) => { a.sort_order = i; });
    const { error } = await sb.from("apps").upsert(apps.map(slim));
    if (error) { console.error(error); toast("並び順を保存できませんでした。", true); await loadApps(); return; }
    toast("並び順を保存しました。");
  }

  async function toggleVisible(app) {
    const next = !app.visible;
    const { error } = await sb.from("apps").update({ visible: next }).eq("id", app.id);
    if (error) { console.error(error); toast("切り替えられませんでした。", true); return; }
    app.visible = next;
    render();
    toast(next ? "生徒に表示します。" : "生徒には表示しません。");
  }

  async function removeApp(app) {
    if (!confirm("「" + app.name + "」を削除します。元に戻せません。よろしいですか?")) return;
    const { error } = await sb.from("apps").delete().eq("id", app.id);
    if (error) { console.error(error); toast("削除できませんでした。", true); return; }
    apps = apps.filter(a => a.id !== app.id);
    render();
    toast("削除しました。");
  }

  /* ---------- 自分用メモ ---------- */
  function clearMemo() {
    userId = null;
    $("mAccount").value = "";
    $("mMemo1").value = "";
    $("mMemo2").value = "";
    $("memoStamp").textContent = "";
    $("memoBox").open = false;
  }

  async function loadMemo() {
    const { data, error } = await sb.from("teacher_memo").select("*").eq("user_id", userId).maybeSingle();
    if (error) {
      console.error(error);
      $("memoStamp").textContent = "メモを読み込めませんでした。add_memo.sql を実行済みか確認してください。";
      return;
    }
    $("mAccount").value = data ? data.supabase_account : "";
    $("mMemo1").value = data ? data.memo1 : "";
    $("mMemo2").value = data ? data.memo2 : "";
    $("memoStamp").textContent = data ? "最終保存: " + new Date(data.updated_at).toLocaleString("ja-JP") : "";
  }

  async function saveMemo() {
    $("memoSave").disabled = true;
    const { data, error } = await sb.from("teacher_memo").upsert({
      user_id: userId,
      supabase_account: $("mAccount").value.trim(),
      memo1: $("mMemo1").value,
      memo2: $("mMemo2").value
    }).select().single();
    $("memoSave").disabled = false;
    if (error) { console.error(error); toast("メモを保存できませんでした。", true); return; }
    $("memoStamp").textContent = "最終保存: " + new Date(data.updated_at).toLocaleString("ja-JP");
    toast("メモを保存しました。");
  }

  $("memoSave").addEventListener("click", saveMemo);

  /* ---------- 一覧表示 ---------- */
  function iconNode(app) {
    const box = document.createElement("div");
    box.className = "arch";
    box.setAttribute("aria-hidden", "true");
    if (/^https?:\/\//i.test(app.icon)) {
      const img = document.createElement("img");
      img.src = app.icon; img.alt = "";
      img.addEventListener("error", () => { img.remove(); box.textContent = app.name.slice(0, 1); });
      box.append(img);
    } else {
      box.textContent = app.icon || app.name.slice(0, 1);
    }
    return box;
  }

  function btn(label, cls, onClick, disabled) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn small " + (cls || "");
    b.textContent = label;
    b.disabled = !!disabled;
    b.addEventListener("click", onClick);
    return b;
  }

  async function move(i, d) {
    const j = i + d;
    if (j < 0 || j >= apps.length) return;
    [apps[i], apps[j]] = [apps[j], apps[i]];
    render();
    await saveOrder();
  }

  function consoleLink(label, url) {
    if (url) {
      const a = document.createElement("a");
      a.className = "cbtn";
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      a.textContent = label + "を開く";
      return a;
    }
    const s = document.createElement("span");
    s.className = "cbtn off";
    s.textContent = label + "(未設定)";
    return s;
  }

  function consoleLinks(app) {
    const c = consoles[app.id] || {};
    const box = document.createElement("div");
    box.className = "consoles";
    box.append(consoleLink("管理コンソール", c.admin_url), consoleLink("授業コンソール", c.lesson_url));
    return box;
  }

  function rowNode(app, i) {
    const li = document.createElement("li");
    li.className = "row" + (app.visible ? "" : " hidden-app");
    li.style.setProperty("--tone", toneOf(app.category || app.name));
    li.draggable = true;

    li.addEventListener("dragstart", e => { dragIndex = i; li.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", String(i)); });
    li.addEventListener("dragend", () => { dragIndex = null; li.classList.remove("dragging"); document.querySelectorAll(".over").forEach(x => x.classList.remove("over")); });
    li.addEventListener("dragover", e => { if (dragIndex === null) return; e.preventDefault(); li.classList.add("over"); });
    li.addEventListener("dragleave", () => li.classList.remove("over"));
    li.addEventListener("drop", async e => {
      e.preventDefault();
      li.classList.remove("over");
      if (dragIndex === null || dragIndex === i) return;
      const [item] = apps.splice(dragIndex, 1);
      apps.splice(i, 0, item);
      dragIndex = null;
      render();
      await saveOrder();
    });

    const grip = document.createElement("div");
    grip.className = "grip"; grip.textContent = "⋮⋮"; grip.setAttribute("aria-hidden", "true");

    const info = document.createElement("div");
    info.className = "info";
    const n = document.createElement("div");
    n.className = "n";
    n.append(document.createTextNode(app.name));
    if (!app.visible) {
      const t = document.createElement("span");
      t.className = "tag-hidden"; t.textContent = "非表示";
      n.append(t);
    }
    const u = document.createElement("div");
    u.className = "u"; u.textContent = app.url;
    info.append(n, u);
    if (app.category) {
      const c = document.createElement("div");
      c.className = "c"; c.textContent = app.category;
      info.append(c);
    }
    info.append(consoleLinks(app));

    const acts = document.createElement("div");
    acts.className = "acts";
    acts.append(
      btn("↑", "", () => move(i, -1), i === 0),
      btn("↓", "", () => move(i, 1), i === apps.length - 1),
      btn(app.visible ? "非表示にする" : "表示する", "", () => toggleVisible(app)),
      btn("編集", "", () => openForm(app)),
      btn("削除", "danger", () => removeApp(app))
    );

    li.append(grip, iconNode(app), info, acts);
    return li;
  }

  function render() {
    const list = $("list");
    list.replaceChildren();
    if (apps.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "アプリがまだありません。「アプリを追加」か「JSONを読み込む」から登録してください。";
      list.append(li);
    } else {
      list.append(...apps.map(rowNode));
    }
    const shown = apps.filter(a => a.visible).length;
    $("count").textContent = "全 " + apps.length + " 件(生徒に表示: " + shown + " 件)";

    const cats = [...new Set(apps.map(a => a.category).filter(Boolean))];
    $("catList").replaceChildren(...cats.map(c => Object.assign(document.createElement("option"), { value: c })));
  }

  /* ---------- 追加・編集 ---------- */
  function openForm(app) {
    editingId = app ? app.id : null;
    $("dlgTitle").textContent = app ? "アプリを編集" : "アプリを追加";
    $("fName").value = app ? app.name : "";
    $("fUrl").value = app ? app.url : "";
    $("fDesc").value = app ? app.description : "";
    $("fCat").value = app ? app.category : "";
    $("fIcon").value = app ? app.icon : "";
    $("fTags").value = app ? (app.tags || []).join(", ") : "";
    $("fVisible").checked = app ? app.visible : true;
    const cs = app ? (consoles[app.id] || {}) : {};
    $("fAdminUrl").value = cs.admin_url || "";
    $("fLessonUrl").value = cs.lesson_url || "";
    $("formErr").textContent = "";
    $("dlg").showModal();
    $("fName").focus();
  }

  $("addBtn").addEventListener("click", () => openForm(null));
  $("cancelBtn").addEventListener("click", () => $("dlg").close());

  $("appForm").addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("formErr");
    err.textContent = "";

    const name = $("fName").value.trim();
    const url = $("fUrl").value.trim();
    if (!name) { err.textContent = "アプリ名を入力してください。"; return; }
    if (!validUrl(url)) { err.textContent = "URLは https:// から始まる形式で入力してください。"; return; }
    const dup = apps.find(a => a.id !== editingId && normalizeUrl(a.url) === normalizeUrl(url));
    if (dup) { err.textContent = "同じURLが「" + dup.name + "」として登録済みです。"; return; }

    const icon = $("fIcon").value.trim();
    if (/^[a-z][a-z0-9+.-]*:/i.test(icon) && !/^https?:\/\//i.test(icon)) {
      err.textContent = "アイコンの画像URLは https:// から始まる形式にしてください。"; return;
    }

    const adminUrl = $("fAdminUrl").value.trim();
    const lessonUrl = $("fLessonUrl").value.trim();
    if (adminUrl && !validUrl(adminUrl)) { err.textContent = "管理コンソールのURLは https:// から始まる形式で入力してください。"; return; }
    if (lessonUrl && !validUrl(lessonUrl)) { err.textContent = "授業コンソールのURLは https:// から始まる形式で入力してください。"; return; }

    const payload = {
      name, url,
      description: $("fDesc").value.trim(),
      category: $("fCat").value.trim(),
      icon,
      tags: parseTags($("fTags").value),
      visible: $("fVisible").checked
    };

    $("saveBtn").disabled = true;
    let error;
    let appId = editingId;
    if (editingId) {
      ({ error } = await sb.from("apps").update(payload).eq("id", editingId));
    } else {
      payload.sort_order = apps.length ? Math.max(...apps.map(a => a.sort_order)) + 1 : 0;
      let row;
      ({ data: row, error } = await sb.from("apps").insert(payload).select("id").single());
      if (row) appId = row.id;
    }
    if (!error) error = await saveConsoles(appId, adminUrl, lessonUrl);
    $("saveBtn").disabled = false;

    if (error) { console.error(error); err.textContent = "保存できませんでした。入力内容を確認してください。"; return; }
    $("dlg").close();
    await loadApps();
    toast("保存しました。");
  });

  /* ---------- JSON 書き出し・読み込み ---------- */
  $("exportBtn").addEventListener("click", () => {
    const out = apps.map(a => ({
      name: a.name, url: a.url, description: a.description, category: a.category,
      icon: a.icon, tags: a.tags, visible: a.visible,
      admin_url: (consoles[a.id] || {}).admin_url || "",
      lesson_url: (consoles[a.id] || {}).lesson_url || ""
    }));
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "arc-app-hub-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
    toast("書き出しました。");
  });

  $("importBtn").addEventListener("click", () => $("importFile").click());

  $("importFile").addEventListener("change", async e => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;

    let items;
    try {
      items = JSON.parse(await file.text());
      if (!Array.isArray(items)) throw new Error("not array");
    } catch (x) { toast("JSONの形式が正しくありません。", true); return; }

    const seen = new Set(apps.map(a => normalizeUrl(a.url)));
    const rows = [];
    const extras = {}; // 正規化URL -> コンソールURL
    let skipped = 0;
    let order = apps.length ? Math.max(...apps.map(a => a.sort_order)) + 1 : 0;

    for (const it of items) {
      const name = String(it && it.name || "").trim().slice(0, 80);
      const url = String(it && it.url || "").trim();
      const icon = String(it && it.icon || "").trim();
      const iconOk = !/^[a-z][a-z0-9+.-]*:/i.test(icon) || /^https?:\/\//i.test(icon);
      if (!name || !validUrl(url) || !iconOk || seen.has(normalizeUrl(url))) { skipped++; continue; }
      seen.add(normalizeUrl(url));
      const au = String(it.admin_url || "").trim();
      const lu = String(it.lesson_url || "").trim();
      extras[normalizeUrl(url)] = { admin: validUrl(au) ? au : "", lesson: validUrl(lu) ? lu : "" };
      rows.push({
        name, url, icon,
        description: String(it.description || "").trim().slice(0, 200),
        category: String(it.category || "").trim().slice(0, 40),
        tags: Array.isArray(it.tags) ? parseTags(it.tags.join(",")) : parseTags(it.tags || ""),
        visible: it.visible !== false,
        sort_order: order++
      });
    }

    if (rows.length === 0) { toast("追加できるアプリがありませんでした(重複・不正な行は " + skipped + " 件)。", true); return; }
    if (!confirm(rows.length + " 件を追加します(重複・不正な行は " + skipped + " 件スキップ)。よろしいですか?")) return;

    const { data: inserted, error } = await sb.from("apps").insert(rows).select("id, url");
    if (error) { console.error(error); toast("読み込めませんでした。", true); return; }

    const cRows = (inserted || []).map(r => {
      const x = extras[normalizeUrl(r.url)] || {};
      return (x.admin || x.lesson) ? { app_id: r.id, admin_url: x.admin || null, lesson_url: x.lesson || null } : null;
    }).filter(Boolean);
    let cErr = null;
    if (cRows.length) ({ error: cErr } = await sb.from("app_consoles").upsert(cRows));

    await loadApps();
    if (cErr) { console.error(cErr); toast(rows.length + " 件を追加しましたが、コンソールURLは保存できませんでした。", true); }
    else toast(rows.length + " 件を追加しました。");
  });

  /* ---------- 起動 ---------- */
  $("remember").checked = remembering();
  try { const saved = localStorage.getItem(EMAIL_KEY); if (saved) $("email").value = saved; } catch (e) { /* 何もしない */ }
  sb.auth.getSession().then(({ data }) => showForSession(data.session));
})();
</script>
</body>
</html>
